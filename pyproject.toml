[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wes-api-gateway"
dynamic = ["version"]
description = 'WES API Gateway'
readme = "README.md"
requires-python = ">=3.8"
license = "Apache-2.0"
keywords = []
authors = [
  { name = "stripodi", email = "simone.tripodi@terradue.com" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
  "fastapi==0.138.0",
  "pydantic>=2.0.0,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
]

[project.urls]
Documentation = "https://github.com/stripodi/wes-api-gateway#readme"
Issues = "https://github.com/stripodi/wes-api-gateway/issues"
Source = "https://github.com/stripodi/wes-api-gateway"

[tool.hatch.version]
path = "src/wes_api_gateway/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/wes_api_gateway tests}"

[tool.coverage.run]
source_pkgs = ["wes_api_gateway"]
branch = true
parallel = true
omit = [
  "src/wes_api_gateway/__about__.py",
]

[tool.coverage.paths]
wes_api_gateway = ["src/wes_api_gateway"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]

[tool.hatch.envs.test]
description = "Test environment"
skip-install = false
dependencies = ["pytest==9.0.2", "pytest-cov==7.0.0"]

[tool.hatch.envs.test.scripts]
test = "pytest"
test-q = "pytest -q"
test-cov = "pytest --cov=src/wes_api_gateway"
test-show-setup = "pytest --setup-show"

[[tool.hatch.envs.test.matrix]]
python = ["3.10", "3.11", "3.12", "3.13", "3.14"]

[tool.hatch.envs.dev]
description = "Development environment"
dependencies = [
  "pytest==9.0.2",
  "ruff==0.15.6",
]

[tool.hatch.envs.dev.scripts]
lint = "ruff format src tests"
check = "ruff check --fix src tests"

[tool.hatch.envs.prod]
description = "Production container environment"
path = "/app/envs/appuser"
dependencies = [
  "uvicorn[standard]>=0.30.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

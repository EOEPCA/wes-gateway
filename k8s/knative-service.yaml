apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: wes-gateway
spec:
  template:
    spec:
      serviceAccountName: mate-api-sa
      containers:
        - name: wes-gateway
          image: dev.local/eoepca/wes-gateway
          ports:
            - containerPort: 8090
          env:
            - name: ARGO_SERVER_HOST
              value: "http://argo-workflows-server.{namespace}:2746"
            - name: AUTH_TOKEN_NAME
              value: "argo.service-account-token"
            - name: AUTH_TOKEN_KEY
              value: "token"
          securityContext:
            runAsUser: 1001
            runAsGroup: 100
            allowPrivilegeEscalation: false
            runAsNonRoot: true
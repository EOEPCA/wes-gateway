site_name: WES API Gateway
site_url: https://EOEPCA.github.io/wes-gateway/
site_author: Fabrice Brito, Simone Tripodi
repo_url: https://github.com/EOEPCA/wes-gateway/
repo_name: EOEPCA/wes-gateway

theme:
  name: material

  palette:
  - media: "(prefers-color-scheme: light)"
    scheme: default
    toggle:
      icon: material/toggle-switch-off-outline
      name: Switch to dark mode
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    toggle:
      icon: material/toggle-switch
      name: Switch to light mode

plugins:
  - search
  - build_plantuml:
      render: 'server' # or "local" for local rendering
      disable_ssl_certificate_validation: true # for self-signed and invalid certs
      output_format: 'svg'
      allow_multiple_roots: false # in case your codebase contains more locations for diagrams (all ending in diagram_root)
      diagram_root: 'docs/diagrams' # should reside under docs_dir
      input_folder: 'src'
      output_folder: 'out'
      theme_enabled: true
      theme_folder: "include/themes"
      theme_light: "light.puml"
      theme_dark: "dark.puml"

markdown_extensions:
  - pymdownx.details
  - abbr
  - admonition
  - footnotes
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.tabbed
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - attr_list
  - pymdownx.snippets:
      base_path: './'
  - pymdownx.highlight:
      line_spans: __span

exclude_docs: |
  /c4/
  /diagrams/src/

nav:
  - Home: index.md
  - Tutorials:
    - Run your first workflow: tutorials/submit-and-monitor-cwl.md
  - How-to guides:
    - Deploy the complete stack with Skaffold: how-to-guides/deploy-stack-with-skaffold.md
    - Deploy with Toil WES: how-to-guides/deploy-with-toil.md
    - Add additional backends: how-to-guides/add-backends.md
    - Add an HPC-backed WES service: how-to-guides/add-hpc-backend.md
    - Configure storage and credentials: how-to-guides/configure-backends.md
    - Submit workflow runs: how-to-guides/submit-workflow-runs.md
    - Monitor and cancel runs: how-to-guides/monitor-and-cancel-runs.md
    - Troubleshoot deployment and runs: how-to-guides/troubleshoot.md
  - Reference:
    - Configuration: reference/configuration.md
    - API reference: reference/api.md
  - Explanation:
    - Gateway and execution backends: explanation/architecture.md
    - C4 model:
      - Overview: explanation/c4/index.md
      - System context: explanation/c4/system-context.md
      - Gateway containers: explanation/c4/containers.md
      - Kubernetes deployment: explanation/c4/deployment.md
      - WES request flow: explanation/c4/request-flow.md
      - Target hybrid architecture (planned): explanation/c4/target-hybrid.md

copyright: <a href="https://www.apache.org/licenses/LICENSE-2.0"><img src="https://img.shields.io/badge/license-Apache%20License%202.0-blue" alt="Apache License, Version 2.0" /></a>

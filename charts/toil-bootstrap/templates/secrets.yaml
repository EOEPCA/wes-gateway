{{- if .Values.s3.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: toil-s3
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.s3.accessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.s3.secretKey | quote }}
  seaweedfs_s3_config: {{ dict "identities" (list (dict "name" "toil" "credentials" (list (dict "accessKey" .Values.s3.accessKey "secretKey" .Values.s3.secretKey)) "actions" (list "Admin" "Read" "Write" "List" "Tagging"))) | toJson | quote }}
{{- end }}
{{- if .Values.rabbitmq.enabled }}
{{- $user := .Values.rabbitmq.username }}
{{- $password := .Values.rabbitmq.password }}
{{- $vhost := "/" }}
{{- if .Values.rabbitmq.tenant }}
{{- $tenant := required "rabbitmq.tenant must exist in rabbitmq.tenants" (index .Values.rabbitmq.tenants .Values.rabbitmq.tenant) }}
{{- $user = $tenant.username }}
{{- $password = $tenant.password }}
{{- $vhost = .Values.rabbitmq.tenant }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: toil-rabbitmq
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  username: {{ $user | quote }}
  password: {{ $password | quote }}
  {{- if not .Values.rabbitmq.tenant }}
  erlang-cookie: {{ .Values.rabbitmq.erlangCookie | quote }}
  {{- end }}
  broker-url: {{ printf "amqp://%s:%s@%s:5672/%s" ($user | urlquery | replace "+" "%20") ($password | urlquery | replace "+" "%20") .Values.rabbitmq.host ($vhost | urlquery | replace "+" "%20") | quote }}
{{- end }}

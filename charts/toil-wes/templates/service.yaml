{{- if .Values.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "toil-wes.fullname" . }}
  labels:
    {{- include "toil-wes.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "toil-wes.fullname" . }}
    app.kubernetes.io/instance: {{ include "toil-wes.fullname" . }}
{{- end }}

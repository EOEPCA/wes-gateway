apiVersion: v1
kind: Service
metadata:
  name: {{ include "wes-gateway.fullname" . }}
  labels:
    {{- include "wes-gateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "wes-gateway.selectorLabels" . | nindent 4 }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      name: http
